<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILLAVILUXE | الصفحة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #FFFCF3;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .welcome-text {
            margin-bottom: 60px;
            position: relative;
            padding: 20px;
        }
        
        .fade-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffd700, #ffaa00, #ffd700);
            background-size: 100% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 2s ease-in-out, shine 1s linear infinite;
            line-height: 1.3;
        }
        
        .brand-name {
            font-size: 4.5rem;
            font-weight: 900;
            max-width: 80%;
            margin-inline: 5%;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
            letter-spacing: 2px;
            margin-top: 10px;
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 40px;
        }
        
        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 370px;
            height: 220px;
            border-radius: 50%;
            text-decoration: none;
            border: 3px solid black;
            font-weight: bold;
            font-size: 1.4rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        
        .btn-beauty {
            background: linear-gradient(135deg, #FFF8AE, #93731F);
            color: #fff;
        }
        
        .btn-clothing {
            background: linear-gradient(135deg, #5D8E9D, #1C6468);
            color: white;
        }
        
        .btn-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        
        .btn:hover .btn-icon {
            transform: scale(1.2);
        }
        
        .btn-text {
            font-size: 1rem;
            letter-spacing: 1px;
        }
        
        .btn-description {
            font-size: 0.6rem;
            opacity: 0.9;
            margin-top: 2px;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        
        .btn:hover::before {
            transform: translateX(100%);
        }
        
        /* Animations */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        
        @keyframes glow {
            0% { text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
            100% { text-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 35px rgba(255, 215, 0, 0.6); }
        }
        
        /* Decorative elements */
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.05);
        }
        
        .circle:nth-child(1) {
            width: 150px;
            height: 150px;
            top: 10%;
            left: 5%;
            animation: float 8s infinite ease-in-out;
        }
        
        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: 10%;
            right: 5%;
            animation: float 10s infinite ease-in-out reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .fade-text {
                font-size: 1.5rem;
            }
            
            .brand-name {
                font-size: 2.5rem;
            }
            
            .btn {
                width: 180px;
                height: 180px;
            }
            
            .btn-text {
                font-size: 1rem;
            }
            
            .btn-icon {
                font-size: 3rem;
            }
        }
        
        @media (max-width: 480px) {
            .fade-text {
                font-size: 2rem;
            }
            
            .brand-name {
                font-size: 2.8rem;
            }
            
            .buttons-container {
                gap: 20px;
            }
            
            .btn {
                width: 150px;
                height: 150px;
            }
            
            .btn-text {
                font-size: 1.1rem;
            }
            
            .btn-icon {
                font-size: 2.5rem;
            }
        }
        
        .footer {
            margin-top: 50px;
            text-align: center;
            color: black;
            font-size: 0.7rem;
        }
        .btn-video {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
}

.btn-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
    </style>
</head>
<body>
    <div class="decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    
    <div class="container">
        <div class="welcome-text">
            <div class="fade-text">  Bienvenue chez</div>
            <div class="brand-name">BILLAVILUXE</div>
        </div>
        
        <div class="buttons-container">
            <a href="beautypdc.html" class="btn btn-beauty">
              
    <div class="btn-video">
        <video src="Videos/iny.mp4" 
               autoplay 
               muted 
               loop 
               playsinline>
        </video>
    </div>
            </a>
            <a href="clthpdc.html" class="btn btn-clothing">

    <div class="btn-video">
        <video src="Videos/ink.mp4"    autoplay 
               muted 
               loop 
               playsinline>
        </video>
    </div>
</a>
        </div>
        
        <div class="footer">
            <p>جميع الحقوق محفوظة &copy; 2026 BILLAVILUXE</p>
        </div>
    </div>

    <script>
        // إضافة تأثيرات تفاعلية إضافية عند النقر على الأزرار
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                // إضافة تأثير ضغط عند النقر
                this.style.transform = 'scale(0.95)';
                
                // إعادة الحجم الطبيعي بعد فترة قصيرة
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
                
                // في حالة حقيقية، سينتقل المتصفح تلقائياً إلى الرابط
                // ولكننا نضيف رسالة تأكيد هنا للعرض التوضيحي
                const pageName = this.classList.contains('btn-beauty') ? "منتجات التجميل" : "الملابس الفاخرة";
                console.log(`جارٍ التوجيه إلى صفحة ${pageName}...`);
            });
        });
        
        // تأثير إضافي للترحيب عند تحميل الصفحة
        window.addEventListener('load', function() {
            const welcomeText = document.querySelector('.fade-text');
            const brandName = document.querySelector('.brand-name');
            
            // إعادة تشغيل الأنيميشن
            welcomeText.style.animation = 'none';
            brandName.style.animation = 'none';
            
            setTimeout(() => {
                welcomeText.style.animation = '';
                brandName.style.animation = '';
            }, 10);
        });
    </script>
</body>
</html>
